[package]
name = "redrise-setup"
version = "0.1.0"
edition = "2021"
description = "RedRise per-user installer: self-contained payload, verified, atomic swap with rollback"
license = "LicenseRef-RedRise-Proprietary"
publish = false

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
serde_json = "1"
mslnk = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
